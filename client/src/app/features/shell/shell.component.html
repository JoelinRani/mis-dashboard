<div class="shell" [class.collapsed]="isCollapsed">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Park Intelli Solutions</div>
        <div class="brand-sub">MIS Dashboard Platform</div>
      </div>
      <button class="collapse-toggle" (click)="toggleSidebar()"
        [attr.title]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'" aria-label="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="toggle-icon">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
    </div>

    <nav class="nav">
      <div class="nav-section-title">
        <span>DEPARTMENTS</span>
        <!-- <span class="count-badge" *ngIf="departments.length">{{ departments.length }}</span> -->
      </div>

      <ng-container *ngIf="!loading && !loadError">
        <a *ngFor="let d of departments" class="nav-item" [class.disabled]="!d.available"
          [routerLink]="d.available ? ['/', d.id] : null" routerLinkActive="active"
          [attr.title]="isCollapsed ? d.label + (d.available ? '' : ' (Unavailable)') : (d.available ? 'Live Data Available' : 'Source File Missing')">
          <div class="nav-item-icon">
            <svg *ngIf="d.id === 'marketing'" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="m16 12-4-4-4 4"></path>
              <path d="M12 16V8"></path>
            </svg>
            <svg *ngIf="d.id === 'cre-utilization'" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <svg *ngIf="d.id === 'outbound-desk'" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
              </path>
            </svg>
            <svg *ngIf="d.id === 'sw-engineering'" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <svg *ngIf="d.id === 'it-operations'" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
              <line x1="6" y1="6" x2="6.01" y2="6"></line>
              <line x1="6" y1="18" x2="6.01" y2="18"></line>
            </svg>
            <svg *ngIf="d.id === 'hr-query'" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="9" y1="15" x2="15" y2="15"></line>
              <line x1="9" y1="11" x2="11" y2="11"></line>
            </svg>
            <svg
              *ngIf="d.id !== 'marketing' && d.id !== 'cre-utilization' && d.id !== 'outbound-desk' && d.id !== 'sw-engineering' && d.id !== 'it-operations' && d.id !== 'hr-query'"
              width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
          </div>

          <span class="nav-item-label">{{ d.label }}</span>

          <span class="status-indicator" [class.online]="d.available" [class.offline]="!d.available"
            [attr.title]="d.available ? 'Live Data Available' : 'Source File Missing'">
            <span class="status-dot"></span>
          </span>
        </a>
      </ng-container>

      <div class="nav-hint loading-state" *ngIf="loading">
        <div class="spinner"></div>
        <span class="loading-text">Fetching department list…</span>
      </div>

      <div class="nav-hint error-state" *ngIf="loadError">
        <span>Unable to reach server.</span>
        <button class="retry-btn" (click)="load()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Retry
        </button>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="system-status-card">
        <div class="status-header">
          <span class="live-pulse"></span>
          <span class="status-title">System Status</span>
        </div>
        <div class="status-desc">Automated MIS Engine Active</div>
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
